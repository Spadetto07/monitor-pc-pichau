name: Monitor PC Pichau

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: monitor-pc-pichau
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Executar monitoramento
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python monitor_pichau.py

      - name: Salvar estado de preços no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add estado.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nenhuma mudanca de preco para commitar."
          else
            git commit -m "Atualiza estado de precos [skip ci]"
            git pull --rebase origin main
            git push
          fi
